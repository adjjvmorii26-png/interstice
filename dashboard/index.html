<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Interstice — Bridge Cartographer</title>
<style>
  :root{
    --bg:#07070a; --panel:#101018; --ink:#c8c8d4; --dim:#6b6b7a;
    --gold:#fff3a0; --violet:#c8a8ff; --blue:#8fd3ff; --mint:#7fffd4; --line:#232330;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;padding:24px;min-height:100vh}
  a{color:var(--blue)}
  .wrap{max-width:1100px;margin:0 auto}
  header{border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:20px}
  h1{color:var(--gold);font-size:20px;letter-spacing:2px}
  .sub{color:var(--dim);font-size:12px;margin-top:6px}
  .stats{display:flex;gap:16px;flex-wrap:wrap;margin:18px 0}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 18px;flex:1;min-width:120px}
  .stat b{display:block;color:var(--gold);font-size:20px}
  .stat span{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:1px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px}
  .card h3{color:var(--blue);font-size:12px;letter-spacing:1px;margin-bottom:10px}
  .bridge{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #1a1a24;font-size:12px}
  .bridge:last-child{border-bottom:0}
  .bar{height:4px;background:#1a1a24;border-radius:2px;overflow:hidden;flex:1}
  .bar>div{height:100%;background:var(--mint)}
  .r{color:var(--gold);font-size:11px;width:34px;text-align:right}
  .affinities{display:inline-block;background:#16161f;border:1px solid var(--line);color:var(--mint);font-size:10px;padding:2px 8px;border-radius:10px;margin:2px}
  footer{margin-top:28px;border-top:1px solid var(--line);padding-top:14px;font-size:11px;color:var(--dim)}
</style>
</head>

<div class="wrap">

function stat(label, val){
  return '<div class="stat"><b>' + val + '</b><span>' + label + '</span></div>';
}

function init(){
  const s = DATA.statistics;
  document.getElementById('stats').innerHTML =
    stat('repos mapped', s.repos) +
    stat('living organs', s.organs) +
    stat('untouched bridges', s.untouched_bridges) +
    stat('repos with bridges', s.unique_repos_with_bridges);
  const sel = document.getElementById('filter');
  const repos = [...new Set(DATA.top_bridges.map(b => b.repo))].sort();
  const all = document.createElement('option');
  all.value = ''; all.textContent = 'All bridges';
  sel.appendChild(all);
  repos.forEach(r => {
    const o = document.createElement('option');
    o.value = r; o.textContent = r;
    sel.appendChild(o);
  });
  render();
}

function freq(ar){
  return ar.reduce((acc, x) => { acc[x] = (acc[x]||0) + 1; return acc; }, {});
}

function render(){
  const f = document.getElementById('filter').value;
  const bridges = f ? DATA.top_bridges.filter(b => b.repo === f) : DATA.top_bridges;
  const byOrg = {};
  bridges.forEach(b => {
    (byOrg[b.organ] = byOrg[b.organ] || []).push(b);
  });
  const cards = Object.keys(byOrg).sort((a,b) => byOrg[b][0].resonance - byOrg[a][0].resonance).map(organ => {
    const bs = byOrg[organ].sort((a,b) => b.resonance - a.resonance);
    const layer = bs[0].organ_layer;
    const pct = Math.round(bs[0].resonance * 100);
    return '<div class="card"><h3>◈ ' + organ + ' <span style="color:var(--dim);font-weight:normal">· ' + layer + '</span></h3>' +

        '<div class="bridge"><span class="r">' + b.resonance.toFixed(2) + '</span>' +
        '<span style="min-width:130px;color:var(--violet)">' + b.repo + '</span>' +
        '<div class="bar"><div style="width:' + Math.round(b.resonance*100) + '%"></div></div></div>'
      ).join('') + '</div>';
  });
  document.getElementById('cards').innerHTML = cards.join('') || '<p class="sub">No bridges for this filter.</p>';
}
